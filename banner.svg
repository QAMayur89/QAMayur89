<svg width="1280" height="320" viewBox="0 0 1280 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Mayur Vijayvargiya — QA and Delivery Lead">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="0.55" stop-color="#0C2233"/>
      <stop offset="1" stop-color="#0A2E2A"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2EAD33"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="320" rx="16" fill="url(#bg)"/>

  <!-- subtle dot grid -->
  <g fill="#1B2B3A" opacity="0.6">
    <circle cx="60" cy="40" r="2"/><circle cx="110" cy="40" r="2"/><circle cx="160" cy="40" r="2"/>
    <circle cx="60" cy="90" r="2"/><circle cx="110" cy="90" r="2"/><circle cx="160" cy="90" r="2"/>
    <circle cx="60" cy="140" r="2"/><circle cx="110" cy="140" r="2"/><circle cx="160" cy="140" r="2"/>
  </g>

  <!-- left accent bar -->
  <rect x="72" y="96" width="6" height="128" rx="3" fill="url(#accent)"/>

  <!-- name + titles -->
  <text x="104" y="132" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="54" font-weight="800" fill="#F8FAFC">Mayur Vijayvargiya</text>
  <text x="106" y="178" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="27" font-weight="700" fill="#38BDF8">QA &amp; Delivery Lead</text>
  <text x="106" y="214" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="500" fill="#94A3B8">AI-Agent QA Skills  ·  Playwright · pytest  ·  Scrum  ·  9+ years</text>

  <!-- pill tags -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600">
    <rect x="106" y="238" width="150" height="30" rx="15" fill="#12212F" stroke="#243544"/>
    <text x="181" y="258" text-anchor="middle" fill="#CBD5E1">Release management</text>
    <rect x="266" y="238" width="126" height="30" rx="15" fill="#12212F" stroke="#243544"/>
    <text x="329" y="258" text-anchor="middle" fill="#CBD5E1">Jira · POD model</text>
    <rect x="402" y="238" width="150" height="30" rx="15" fill="#12212F" stroke="#243544"/>
    <text x="477" y="258" text-anchor="middle" fill="#CBD5E1">Test automation @ scale</text>
  </g>

  <!-- terminal card (right) -->
  <g>
    <rect x="836" y="72" width="372" height="176" rx="12" fill="#0A0F16" stroke="#22303C"/>
    <rect x="836" y="72" width="372" height="34" rx="12" fill="#111A24"/>
    <rect x="836" y="94" width="372" height="12" fill="#111A24"/>
    <circle cx="858" cy="89" r="5" fill="#FF5F56"/>
    <circle cx="878" cy="89" r="5" fill="#FFBD2E"/>
    <circle cx="898" cy="89" r="5" fill="#27C93F"/>
    <text x="1022" y="93" text-anchor="middle" font-family="SFMono-Regular, Consolas, monospace" font-size="12" fill="#5B6B78">pytest — honest run</text>

    <text x="856" y="140" font-family="SFMono-Regular, Consolas, monospace" font-size="14" fill="#8B98A5">$ <tspan fill="#E2E8F0">pytest -n 8 --dist loadfile</tspan></text>
    <text x="856" y="168" font-family="SFMono-Regular, Consolas, monospace" font-size="14" fill="#8B98A5">collecting … <tspan fill="#E2E8F0">216 tests</tspan></text>
    <text x="856" y="196" font-family="SFMono-Regular, Consolas, monospace" font-size="14" fill="#2EAD33">==== 214 passed, 2 skipped ====</text>
    <text x="856" y="224" font-family="SFMono-Regular, Consolas, monospace" font-size="14" fill="#38BDF8">✓ 95% green · evidence-cited · human-merged</text>
  </g>
